name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "ios/PitWall/connect.html"
      - "web/dist/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
      - ".github/release-notes.md"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Signing key from the secrets (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/pitlane.keystore"
            echo "PITLANE_KEYSTORE_FILE=$RUNNER_TEMP/pitlane.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: the APK is signed with the public debug key"
          fi
      - name: Build APK
        working-directory: android
        env:
          PITLANE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PITLANE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PITLANE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PitlaneHQ-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-android
          path: PitlaneHQ-android.apk
      - name: Publish on the downloads page
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish.sh PitlaneHQ-android.apk
