name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "android/**"
      - "ios/PitWall/connect.html"
      - "web/dist/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
      - ".github/release-notes.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PitlaneHQ-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-android
          path: PitlaneHQ-android.apk
      - name: Publish on the downloads page
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish.sh PitlaneHQ-android.apk

# CI refresh for unified release builds.
