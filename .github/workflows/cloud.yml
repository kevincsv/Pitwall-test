name: Pitlane HQ Cloud (web version)

# Checks the web version on every change. When these repository secrets
# exist it also publishes it to your Cloudflare account:
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" + D1 edit)
#   CLOUDFLARE_ACCOUNT_ID
#   PITLANE_D1_ID          (from: npx wrangler d1 create pitlanehq)
#   PITLANE_KEY            (the key you created in Pitlane HQ → Settings → Connections)

on:
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ secrets.PITLANE_D1_ID }}
      PITLANE_KEY: ${{ secrets.PITLANE_KEY }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Check that it builds
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.D1_ID != ''
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.toml
          npx wrangler d1 execute pitlanehq --remote --file schema.sql
          npx wrangler d1 execute pitlanehq --remote --file migrations/0002_team.sql || true
          if [ -n "$PITLANE_KEY" ]; then echo "$PITLANE_KEY" | npx wrangler secret put PITLANE_KEY; fi
          npx wrangler deploy
