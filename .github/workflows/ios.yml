name: Build iOS app
# Build requested after coach comparator merge

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PitWall.xcodeproj -scheme PitWall -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -80

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PitWall.app Payload/
          zip -qry PitWall.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PitWall-iOS
          path: ios/PitWall.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/PitWall.ipa --title "Pit Wall for iPhone and iPad" \
            --notes "Install PitWall.ipa with Sideloadly. Built from ${GITHUB_SHA}."

      - name: Save result (ipa and build log) to the ios-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp ios/build.log /tmp/out/ 2>/dev/null || true
          grep -E "error:|\*\* BUILD" ios/build.log > /tmp/out/errors.txt 2>/dev/null || true
          cp ios/PitWall.ipa /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA} $(date -u +%FT%TZ)" > /tmp/out/STATUS
          cd /tmp/out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ios-build
          git add -A
          git commit -qm "iOS build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-build
