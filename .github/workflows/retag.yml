# One use: moves the release tags onto the rewritten history (same files, commits without personal data).
# Run it once from Actions, then this file is deleted.
name: Move tags to the rewritten history
on: workflow_dispatch
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -e
          while read -r tag sha; do
            [ -n "$tag" ] || continue
            git cat-file -e "$sha^{commit}"
            git push --force origin "$sha:refs/tags/$tag"
          done <<'TAGS'
