name: Build TrackIQ.exe

# Compiles TrackIQ.exe and the installer and uploads them as a download on the
# run page (Actions → this run → Artifacts) and on the downloads page.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "installer/**"
      - "license_plans.json"
      - "web/**"
      - "assets/**"
      - ".github/workflows/windows.yml"
      - ".github/scripts/**"
      - ".github/release-notes.md"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build TrackIQ.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -mod=vendor -ldflags "-s -w -H windowsgui -X main.buildID=$env:GITHUB_SHA -X main.updateRepo=$env:GITHUB_REPOSITORY" -o TrackIQ.exe .
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item TrackIQ.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: TrackIQ-windows
          path: out/

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path main.go -Pattern 'const appVersion = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" installer\TrackIQ.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TrackIQ-Setup
          path: dist-installer/TrackIQ-Setup.exe

      - name: Publish on the downloads page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && 7z a -tzip ../TrackIQ-windows.zip . >/dev/null)
          # the phone apps are built in their own repository now: no old ones on this page
          for old in TrackIQ-android.apk TrackIQ.ipa; do gh release delete-asset pitlanehq-latest "$old" -y 2>/dev/null || true; done
          bash .github/scripts/publish.sh TrackIQ-windows.zip
          bash .github/scripts/publish.sh dist-installer/TrackIQ-Setup.exe
          # version.json goes last: the app only sees a new version once its zip is there
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          printf '{"version":"%s","build":"%s","date":"%s"}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          bash .github/scripts/publish.sh version.json
          # one release per version with its part of CHANGELOG.md (made once; later builds of the
          # same version only refresh its files)
          tag="v$ver-beta"
          awk -v v="$ver" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          printf '\n---\nWindows: download **TrackIQ-Setup.exe** (installer) or **TrackIQ-windows.zip** (portable). Full history: [CHANGELOG.md](https://github.com/%s/blob/master/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $ver beta" --notes-file notes.md --prerelease --latest=false || true
          gh release upload "$tag" TrackIQ-windows.zip dist-installer/TrackIQ-Setup.exe --clobber || true
