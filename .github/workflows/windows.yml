name: Build PitlaneHQ.exe

# Compiles PitlaneHQ.exe and the installer and uploads them as a download on the
# run page (Actions → this run → Artifacts) and on the downloads page.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "installer/**"
      - "license_plans.json"
      - "web/**"
      - "assets/**"
      - ".github/workflows/windows.yml"
      - ".github/scripts/**"
      - ".github/release-notes.md"
      - "desktop/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build PitlaneHQ.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -mod=vendor -ldflags "-s -w -H windowsgui -X main.buildID=$env:GITHUB_SHA -X main.updateRepo=$env:GITHUB_REPOSITORY" -o PitlaneHQ.exe .
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item PitlaneHQ.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: out/

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path main.go -Pattern 'const appVersion = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" installer\PitlaneHQ.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-Setup
          path: dist-installer/PitlaneHQ-Setup.exe

      - name: Publish on the downloads page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && 7z a -tzip ../PitlaneHQ-windows.zip . >/dev/null)
          # the phone apps are built in their own repository now: no old ones on this page
          for old in PitlaneHQ-android.apk PitlaneHQ.ipa; do gh release delete-asset pitlanehq-latest "$old" -y 2>/dev/null || true; done
          # installs made while the app was called TrackIQ (0.5–0.6.1) update from TrackIQ-windows.zip:
          # keep publishing it (their updater accepts PitlaneHQ.exe inside), so they come back too
          cp PitlaneHQ-windows.zip TrackIQ-windows.zip
          bash .github/scripts/publish.sh TrackIQ-windows.zip
          bash .github/scripts/publish.sh PitlaneHQ-windows.zip
          bash .github/scripts/publish.sh dist-installer/PitlaneHQ-Setup.exe
          # version.json goes last: the app only sees a new version once its zip is there
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          min=$(sed -n 's/^const appMinVersion = "\(.*\)"/\1/p' main.go)
          printf '{"version":"%s","build":"%s","date":"%s","min":"%s"}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${min:-0}" > version.json
          bash .github/scripts/publish.sh version.json
          # one release per version with its part of CHANGELOG.md (made once; later builds of the
          # same version only refresh its files)
          tag="v$ver-beta"
          awk -v v="$ver" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          printf '\n---\nWindows: download **PitlaneHQ-Setup.exe** (installer) or **PitlaneHQ-windows.zip** (portable). Full history: [CHANGELOG.md](https://github.com/%s/blob/master/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $ver beta" --notes-file notes.md --prerelease --latest=false || true
          gh release upload "$tag" PitlaneHQ-windows.zip dist-installer/PitlaneHQ-Setup.exe --clobber || true

  # the native Windows window (desktop/, C# / WPF) over the same engine: a preview next to the
  # normal download. It needs PitlaneHQ.exe next to it, so it ships with a copy.
  desktop:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: engine
      - name: Build Pitlane HQ Desktop
        shell: pwsh
        run: |
          dotnet publish desktop/PitlaneHQ.Desktop/PitlaneHQ.Desktop.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o out-desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item engine/PitlaneHQ.exe out-desktop/
          Copy-Item desktop/README.md out-desktop/README-Desktop.md
          7z a -tzip PitlaneHQ-Desktop.zip ./out-desktop/* | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-Desktop
          path: PitlaneHQ-Desktop.zip
      - name: Publish on the downloads page
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish.sh PitlaneHQ-Desktop.zip
