name: Build PitlaneHQ.exe

# Compiles PitlaneHQ.exe and the installer and uploads them as a download on the
# run page (Actions → this run → Artifacts) and on the downloads page.

on:
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "**.go"
      - "installer/**"
      - "license_plans.json"
      - "web/**"
      - "assets/**"
      - ".github/workflows/windows.yml"
      - ".github/scripts/**"
      - ".github/release-notes.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build PitlaneHQ.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -mod=vendor -ldflags "-s -w -H windowsgui -X main.buildID=$env:GITHUB_SHA -X main.updateRepo=$env:GITHUB_REPOSITORY" -o PitlaneHQ.exe .
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item PitlaneHQ.exe, README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: out/

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path main.go -Pattern 'const appVersion = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" installer\PitlaneHQ.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-Setup
          path: dist-installer/PitlaneHQ-Setup.exe

      - name: Publish on the downloads page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && 7z a -tzip ../PitlaneHQ-windows.zip . >/dev/null)
          bash .github/scripts/publish.sh PitlaneHQ-windows.zip
          bash .github/scripts/publish.sh dist-installer/PitlaneHQ-Setup.exe
          # version.json goes last: the app only sees a new version once its zip is there
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          printf '{"version":"%s","build":"%s","date":"%s"}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          bash .github/scripts/publish.sh version.json
