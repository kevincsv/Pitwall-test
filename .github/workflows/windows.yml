name: Build PitlaneHQ.exe

# One app: compiles the agent (PitlaneHQ.exe, Go) and the native window (desktop/, C# / WPF) that runs it as its
# engine, then the one installer and the updater's zip with both, uploaded on the run page (Actions → this run →
# Artifacts) and, from master, on the downloads page.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "installer/**"
      - "license_plans.json"
      - "web/**"
      - "assets/**"
      - ".github/workflows/windows.yml"
      - ".github/scripts/**"
      - ".github/release-notes.md"
      - "desktop/**"
      - "CHANGELOG.md" # the notes on pitlanehq.app come from here

# one build per branch at a time: a check on another branch never cancels master's (which publishes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build PitlaneHQ.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -mod=vendor -ldflags "-s -w -H windowsgui -X main.buildID=$env:GITHUB_SHA" -o PitlaneHQ.exe .
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item PitlaneHQ.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: out/


  # the native window and everything that ships: the installer, the updater's zip and version.json
  desktop:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: engine
      - name: Build the window (with the agent next to it)
        shell: pwsh
        run: |
          # self-contained: the .NET runtime goes inside, so nothing else has to be installed
          $ver = (Select-String -Path main.go -Pattern 'appVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          dotnet publish desktop/PitlaneHQ.Desktop/PitlaneHQ.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=$ver -o out-desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item engine/PitlaneHQ.exe out-desktop/
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path main.go -Pattern 'appVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$ver" installer\PitlaneHQ.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-Setup
          path: dist-installer/PitlaneHQ-Setup.exe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish on pitlanehq.app (R2)
        # only builds of master go out; a build started on another branch is only a check
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # the updater's zip is the app's folder: the window, its files and the agent at the top
          (cd out-desktop && 7z a -tzip ../PitlaneHQ-windows.zip . >/dev/null)
          cp PitlaneHQ-windows.zip TrackIQ-windows.zip
          # links to the old preview's installer get the one app
          cp dist-installer/PitlaneHQ-Setup.exe PitlaneHQ-Desktop-Setup.exe
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          min=$(sed -n 's/^const appMinVersion = "\(.*\)"/\1/p' main.go)
          printf '{"version":"%s","build":"%s","date":"%s","min":"%s"}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${min:-0}" > version.json
          npx --yes wrangler@4 r2 bucket create pitlanehq-downloads 2>/dev/null || true
          put() { npx --yes wrangler@4 r2 object put "pitlanehq-downloads/$2" --file "$1" --remote --content-type "$3"; }
          put dist-installer/PitlaneHQ-Setup.exe PitlaneHQ-Setup.exe application/vnd.microsoft.portable-executable
          put PitlaneHQ-Desktop-Setup.exe PitlaneHQ-Desktop-Setup.exe application/vnd.microsoft.portable-executable
          put PitlaneHQ-windows.zip PitlaneHQ-windows.zip application/zip
          put TrackIQ-windows.zip TrackIQ-windows.zip application/zip
          put CHANGELOG.md CHANGELOG-pc.md text/markdown
          # version.json goes last: the app only sees a new version once its files are there
          put version.json version.json application/json
      - name: Publish on the GitHub release (record)
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the phone apps are built in their own repository now, and the window's preview is the one app: no old files here
          for old in PitlaneHQ-android.apk PitlaneHQ.ipa PitlaneHQ-Desktop-Setup.exe; do gh release delete-asset pitlanehq-latest "$old" -y 2>/dev/null || true; done
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          bash .github/scripts/publish.sh TrackIQ-windows.zip
          bash .github/scripts/publish.sh PitlaneHQ-windows.zip
          bash .github/scripts/publish.sh dist-installer/PitlaneHQ-Setup.exe
          bash .github/scripts/publish.sh version.json
          # one release per version with its part of CHANGELOG.md (later builds of the same version
          # refresh its files and its notes)
          tag="v$ver-beta"
          awk -v v="$ver" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          printf '\n---\nDownloads: https://pitlanehq.app/downloads · Full history: https://pitlanehq.app/changelog\n' >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $ver beta" --notes-file notes.md --prerelease --latest=false || true
          gh release edit "$tag" --notes-file notes.md >/dev/null 2>&1 || true # the notes follow CHANGELOG.md
          gh release upload "$tag" PitlaneHQ-windows.zip dist-installer/PitlaneHQ-Setup.exe --clobber || true
