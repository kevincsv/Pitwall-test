<style>
/* Same look as the Pitlane HQ app: timing-screen panels on a dark pit wall. */
:root{
  --bg:#11151b;--surface:#19202a;--surface2:#1e2631;--line:#2b3542;--fg:#e7ebf1;--muted:#8a97a9;
  --accent:#ffb02e;--accent-ink:#11151b;--good:#38c97c;--bad:#ff6363;--pb:#b98cff;--blue:#5c9dff;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-data:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#eef1f5;--surface:#fff;--surface2:#f4f6f9;--line:#d6dce5;--fg:#141a22;--muted:#5b677a;--accent:#b86e00;--accent-ink:#fff;--good:#178a4c;--bad:#c62f2f;--pb:#7a3fd1;--blue:#1f63c6;color-scheme:light}}
:root[data-theme=dark]{--bg:#11151b;--surface:#19202a;--surface2:#1e2631;--line:#2b3542;--fg:#e7ebf1;--muted:#8a97a9;--accent:#ffb02e;--accent-ink:#11151b;--good:#38c97c;--bad:#ff6363;--pb:#b98cff;--blue:#5c9dff;color-scheme:dark}
:root[data-theme=light]{--bg:#eef1f5;--surface:#fff;--surface2:#f4f6f9;--line:#d6dce5;--fg:#141a22;--muted:#5b677a;--accent:#b86e00;--accent-ink:#fff;--good:#178a4c;--bad:#c62f2f;--pb:#7a3fd1;--blue:#1f63c6;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.brand{font:700 26px var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:16px;height:16px;background:conic-gradient(var(--fg) 25%,transparent 0 50%,var(--fg) 0 75%,transparent 0) 0 0/8px 8px}
.brand small{font:600 12px var(--f-data);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:2px 5px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}#game{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
nav button,.btn{text-decoration:none;display:inline-block;font:600 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer}
nav button[aria-selected=true],.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:700 32px/1.05 var(--f-display);text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
h2{font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media (max-width:860px){.s8,.s4,.s6{grid-column:span 12}}
.label{font:600 11px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.pb{color:var(--pb);font-weight:600}.bad{color:var(--bad)}.good{color:var(--good)}.muted{color:var(--muted)}
.pill{display:inline-block;font:600 11px/1 var(--f-data);padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
.login{max-width:440px;margin:8vh auto 0;display:grid;gap:12px}
input,select{font:15px var(--f-body);background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
.err{color:var(--bad);min-height:1.2em;font-size:14px}
canvas{width:100%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.chip{font:600 13px var(--f-body);background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{display:grid;gap:2px}.stat b{font:700 30px var(--f-display)}
.langsel select{width:auto;padding:7px 8px;font-size:13px}
nav:not([hidden])+.langsel{margin-left:0}.langsel{margin-left:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--accent)}
.dl{max-width:900px;margin:22px auto 0}
.dlgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.dlc{display:grid;gap:3px;text-decoration:none;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px}
.dlc:hover{border-color:var(--accent)}.dlc b{font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em}.dlc span{color:var(--muted);font-size:13px}
html.embed header .brand,html.embed #out,html.embed #game,html.embed nav a.btn,html.embed .langsel,html.embed #downloads{display:none!important}html.embed .wrap{padding-block:6px 20px;padding-inline:0;max-width:none}html.embed nav{margin-left:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><i aria-hidden="true"></i>Pitlane HQ <small>CLOUD</small></div>
  <nav id="nav" hidden><button type="button" data-v="sessions" aria-selected="true" data-t="Sesiones"></button><button type="button" data-v="bests" aria-selected="false" data-t="Récords"></button><button type="button" data-v="team" aria-selected="false" data-t="Equipo"></button><select id="game" aria-label="Game"><option value="iracing">iRacing</option><option value="lmu" disabled>Le Mans Ultimate · WIP</option><option value="acc" disabled>ACC · WIP</option><option value="ac" disabled>Assetto Corsa · WIP</option></select><a class="btn" href="/app/?companion=1" data-t="Abrir la app"></a><button type="button" id="out" data-t="Salir"></button></nav>
  <label class="langsel"><span class="sr" data-t="Idioma"></span><select id="lang" aria-label="Language / Idioma"><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="pt">Português</option></select></label>
</header>

<div id="login" hidden>
<form class="login panel" id="accLogin">
  <h1 data-t="Tus vueltas, en cualquier sitio"></h1>
  <p class="sub" data-t="PitlaneHQ.exe sube aquí cada vuelta que das en iRacing. Entra con tu cuenta de Pitlane HQ."></p>
  <label><span class="label" data-t="Email"></span><input type="email" id="aEmail" autocomplete="username" required></label>
  <label><span class="label" data-t="Contraseña"></span><input type="password" id="aPass" autocomplete="current-password" required></label>
  <div class="err" id="accErr" role="alert"></div>
  <button class="btn primary" type="submit" data-t="Entrar"></button>
  <p class="sub" style="margin:0"><a href="/account/forgot" id="forgot" data-t="¿Olvidaste tu contraseña?"></a></p>
  <p class="sub" style="margin:0"><span data-t="¿No tienes cuenta?"></span> <a href="#" id="toReg" data-t="Crear una cuenta gratis"></a></p>
</form>
<form class="login panel" id="accReg" hidden>
  <h1 data-t="Crear cuenta"></h1>
  <p class="sub" data-t="Gratis. Tu contraseña nunca sale de este navegador: con ella se crean aquí las claves que cifran tus datos."></p>
  <label><span class="label" data-t="Email"></span><input type="email" id="rEmail" autocomplete="username" required></label>
  <label><span class="label" data-t="Contraseña (mínimo 10 caracteres)"></span><input type="password" id="rPass" autocomplete="new-password" minlength="10" required></label>
  <label><span class="label" data-t="Repite la contraseña"></span><input type="password" id="rPass2" autocomplete="new-password" minlength="10" required></label>
  <label><span class="label" data-t="Nombre público"></span><input type="text" id="rName" maxlength="32" required></label>
  <label class="frow" style="font-size:14px"><input type="checkbox" id="rIr" style="width:auto"> <span data-t="Es mi nombre de iRacing"></span></label>
  <p class="sub" style="margin:0" data-t="Si olvidas la contraseña no se pueden recuperar tus datos cifrados: guárdala bien."></p>
  <div class="err" id="regErr" role="alert"></div>
  <button class="btn primary" type="submit" data-t="Crear cuenta"></button>
  <p class="sub" style="margin:0"><span data-t="¿Ya tienes cuenta?"></span> <a href="#" id="toLogin" data-t="Entrar"></a></p>
</form>
<details class="login panel" style="margin-top:12px"><summary class="sub" data-t="Entrar con una clave (dueño del servidor, equipo o solo lectura)"></summary>
<form id="keyLogin" style="margin-top:10px">
  <label><span class="label" data-t="Clave"></span><input type="password" id="key" autocomplete="current-password" required></label>
  <div class="err" id="loginErr" role="alert"></div>
  <button class="btn" type="submit" data-t="Entrar con clave"></button>
</form></details>
</div>

<section class="dl panel" id="downloads">
  <p style="margin:0 0 12px"><a class="btn primary" href="/app/?companion=1" data-t="Abrir la app en el navegador (análisis, comunidad, en vivo)"></a></p>
  <h2 data-t="Descargar Pitlane HQ"></h2>
  <p class="sub" data-t="Gratis. Usa la misma cuenta en el PC, el móvil y esta web."></p>
  <div class="dlgrid">
    <a class="dlc" href="https://github.com/kevincsv/Pitwall-test/releases/download/pitlanehq-latest/PitlaneHQ-Setup.exe"><b>Windows</b><span data-t="Instalador (recomendado)"></span></a>
    <a class="dlc" href="https://github.com/kevincsv/Pitwall-test/releases/download/pitlanehq-latest/PitlaneHQ-windows.zip"><b>Windows · ZIP</b><span data-t="Portátil, sin instalar"></span></a>
    <a class="dlc" href="https://github.com/kevincsv/Pitwall-test/releases/download/pitlanehq-latest/PitlaneHQ-android.apk"><b>Android</b><span data-t="APK: ábrelo en el móvil y permite instalar"></span></a>
    <a class="dlc" href="https://github.com/kevincsv/Pitwall-test/releases/download/pitlanehq-latest/PitlaneHQ.ipa"><b>iPhone / iPad</b><span data-t="IPA para instalar con Sideloadly"></span></a>
  </div>
</section>

<main id="app" hidden>
  <section id="v-sessions"></section>
  <section id="v-bests" hidden></section>
  <section id="v-team" hidden></section>
  <section id="v-session" hidden></section>
</main>
</div>

function series(l){const t=l&&l.trace;if(!t||!t.d)return null;return{bin:t.bin||5,d:t.d}}
function draw(){const cv=$("#cv"),dv=$("#dv");if(!cv)return;const[x,w,h]=fit(cv),[y,w2,h2]=fit(dv);const A=series(TR[SEL[0]]),B=series(TR[SEL[1]]);
  const cols=[css("--accent"),css("--blue")];$("#lg").innerHTML=SEL.map((id,i)=>{const l=TR[id];return l?`<span><i style="background:${cols[i]}"></i>${i?"B":"A"} · ${T("vuelta")} ${l.n} · ${fmtT(l.time)}${l.session_id!==(CUR&&CUR.session.id)?" · "+esc((l.driver||l.uploader||T("equipo"))):""}</span>`:""}).join("");
  [x,y].forEach((c,i)=>{c.clearRect(0,0,i?w2:w,i?h2:h)});const sets=[A,B].filter(Boolean);
  if(!sets.length){x.fillStyle=css("--muted");x.font="14px "+css("--f-body");x.fillText(T("Esta vuelta no tiene telemetría guardada."),12,30);return}
  const n=Math.max(...sets.map(s=>s.d.length));const val=r=>CH==="speed"?r[0]*3.6:CH==="gear"?r[3]:r[1]*100;const vmax=CH==="speed"?Math.max(...sets.flatMap(s=>s.d.map(r=>r[0]*3.6)))*1.05:CH==="gear"?8:100;
  x.strokeStyle=css("--line");x.lineWidth=1;for(let k=1;k<4;k++){x.beginPath();x.moveTo(0,h*k/4);x.lineTo(w,h*k/4);x.stroke()}
  x.fillStyle=css("--muted");x.font="11px "+css("--f-data");x.fillText(CH==="speed"?Math.round(vmax)+" km/h":CH==="gear"?"8":"100%",4,12);
  [A,B].forEach((s,i)=>{if(!s)return;const plot=(f,col,dash)=>{x.strokeStyle=col;x.setLineDash(dash||[]);x.lineWidth=1.6;x.beginPath();s.d.forEach((r,k)=>{const X=k/(n-1)*w,Y=h-f(r)/vmax*(h-6)-3;k?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();x.setLineDash([])};
    if(CH==="pedals"){plot(r=>r[1]*100,i?css("--blue"):css("--good"));plot(r=>r[2]*100,i?css("--pb"):css("--bad"),i?[4,3]:[])}else plot(val,cols[i])});
  if(A&&B){const cum=s=>{if(s.d.length&&s.d[0].length>5)return s.d.map(r=>r[5]);let t=0;return s.d.map(r=>t+=s.bin/Math.max(r[0],5))}; /* newer laps carry the exact time at each 5 m point */const ca=cum(A),cb=cum(B),m=Math.min(ca.length,cb.length);const dd=[...Array(m)].map((_,k)=>cb[k]-ca[k]);const lim=Math.max(.2,...dd.map(Math.abs));
    y.strokeStyle=css("--line");y.beginPath();y.moveTo(0,h2/2);y.lineTo(w2,h2/2);y.stroke();y.strokeStyle=css("--accent");y.lineWidth=1.6;y.beginPath();dd.forEach((v,k)=>{const X=k/(n-1)*w2,Y=h2/2-v/lim*(h2/2-4);k?y.lineTo(X,Y):y.moveTo(X,Y)});y.stroke();
    y.fillStyle=css("--muted");y.font="11px "+css("--f-data");y.fillText("+"+lim.toFixed(2)+" s",4,12);y.fillText(T("final")+" "+(dd[m-1]>=0?"+":"")+dd[m-1].toFixed(3)+" s",w2-110,h2-6)}}
addEventListener("resize",draw);
if(KEY)get("/api/me").then(me=>{ROLE=me.role;ME=me.name||"";start()}).catch(()=>logout());else logout();
</script>
</body>
</html>
