name = "pitlanehq"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# the old pitlanehq.<account>.workers.dev address keeps answering (PCs set up with it before the domain)
workers_dev = true

# the downloads (PitlaneHQ-Setup.exe, the APK…) and the release notes, uploaded by the build workflows
[[r2_buckets]]
binding = "DL"
bucket_name = "pitlanehq-downloads"

[[d1_databases]]
binding = "DB"
database_name = "pitlanehq"
migrations_dir = "migrations"
# No database_id: the "Deploy to Cloudflare" button creates the database for you.
# Deploying by hand? Add the id printed by `npx wrangler d1 create pitlanehq`:
# database_id = "..."

# secrets (set with `npx wrangler secret put NAME`):
#   PITLANE_KEY  key that PitlaneHQ.exe uses to upload and you use to sign in
#   VIEW_KEY     optional read-only key to share with your engineer or team
#   DATA_KEY     seals telemetry, race analyses and authenticator secrets in the database (AES-GCM).
#                A long random string (`openssl rand -hex 32`). Never change it once rows are sealed.
#   EMAIL_PEPPER optional, salts the email hashes; set it before the first account is created
#   RESEND_API_KEY + EMAIL_FROM   emails (see README)
#   DISCORD_PUBLIC_KEY + DISCORD_BOT_TOKEN   the Discord bot (its commands come to /discord/interactions)
#   DISCORD_APP_ID + DISCORD_CLIENT_SECRET   "Sign in with Discord" and "Link Discord" in the apps (Discord's sign-in
#                      comes back to /discord/oauth, its one redirect address in the Discord application's OAuth2 page)
#   STEAM_WEB_API_KEY  optional, "Sign in with Steam" (Steam's sign-in comes back to /steam/return) names the linked
#                      Steam account; without it the sign-in works and the link has no name
#   FCM_SERVICE_ACCOUNT  optional, the Firebase service account's JSON key: a new alert wakes the phones at once
#                      (pushlib.js); without it they find their alerts in their background check
#   STEAM_APP_ID       the app's id on Steam, for the Steamworks session ticket of the PC (a later step)

[vars]
# accounts, end-to-end encrypted sync, community and shared setups on this server
COMMUNITY = "1"
# the leagues hub is open to everyone (posts, the most active leagues); "0" puts it back in development
LEAGUES_OPEN = "1"
# your Pitlane HQ account id(s), separated by commas, to publish the season schedule
SEASON_UPLOADERS = "3e224233fde0e11f670d2d97"
# admin account id(s): they see Connections (iRacing, Garage 61, own site, Discord) in the app; empty = the SEASON_UPLOADERS
ADMINS = "3e224233fde0e11f670d2d97"

# the full app (web/dist) is served at /app/ by the worker
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

# live telemetry: one room per account, the PC sends and your browsers and phones watch
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# the community model learns the cars and tracks that got new laps
[triggers]
crons = ["*/10 * * * *"]
