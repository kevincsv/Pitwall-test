name: PitWall
options:
  bundleIdPrefix: com.pitwall
  deploymentTarget:
    iOS: "15.0"
targets:
  PitWall:
    type: application
    platform: iOS
    sources:
      - path: PitWall
    scheme: {}
    info:
      path: PitWall/Info.plist
      properties:
        CFBundleDisplayName: Pit Wall
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Pit Wall connects to PitWall.exe on your PC over Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    buildScripts:
      - name: Bundle current web app
        script: |
          set -e
          rm -rf "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/web"
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/web"
          cp -R "${SRCROOT}/../web/dist/." "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/web/"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwall.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
