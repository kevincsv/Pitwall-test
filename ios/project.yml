name: PitWall
options:
  bundleIdPrefix: com.pitwall
  deploymentTarget:
    iOS: "15.0"
targets:
  PitWall:
    type: application
    platform: iOS
    sources:
      - path: PitWall
      - path: Shared
    dependencies:
      - target: PitlaneWidget
        embed: true
    entitlements:
      path: PitWall/PitWall.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pitwall.app]
    scheme: {}
    info:
      path: PitWall/Info.plist
      properties:
        CFBundleDisplayName: Pitlane HQ
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Pitlane HQ connects to PitlaneHQ.exe on your PC over Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwall.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  PitlaneWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PitlaneWidget
      - path: Shared
    info:
      path: PitlaneWidget/Info.plist
      properties:
        CFBundleDisplayName: Pitlane HQ
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PitlaneWidget/PitlaneWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pitwall.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwall.app.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
