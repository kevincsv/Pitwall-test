<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pit Wall</title>
<meta name="theme-color" content="#11151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pit Wall">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: muro de boxes. Cabecera fija + pestañas (barra inferior en móvil); cada vista es una rejilla de paneles de cronometraje. */
:root{
  --bg:#11151b; --surface:#19202a; --surface2:#1e2631; --line:#2b3542;
  --fg:#e7ebf1; --muted:#8a97a9; --accent:#ffb02e; --accent-ink:#11151b;
  --good:#38c97c; --bad:#ff6363; --pb:#b98cff; --warn:#f2c94c; --blue:#5c9dff;
  --lic-r:#ff6363; --lic-d:#ff8f45; --lic-c:#f2c94c; --lic-b:#38c97c; --lic-a:#5c9dff; --lic-p:#c9d1dc;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f4f6f9; --line:#d6dce5;
  --fg:#141a22; --muted:#5b677a; --accent:#b86e00; --accent-ink:#ffffff;
  --good:#178a4c; --bad:#c62f2f; --pb:#7a3fd1; --warn:#9a7300; --blue:#1f63c6;
  --lic-r:#c62f2f; --lic-d:#d9661a; --lic-c:#b88a00; --lic-b:#178a4c; --lic-a:#1f63c6; --lic-p:#4a5568;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f4f6f9; --line:#d6dce5;
  --fg:#141a22; --muted:#5b677a; --accent:#b86e00; --accent-ink:#ffffff;
  --good:#178a4c; --bad:#c62f2f; --pb:#7a3fd1; --warn:#9a7300; --blue:#1f63c6;
  --lic-r:#c62f2f; --lic-d:#d9661a; --lic-c:#b88a00; --lic-b:#178a4c; --lic-a:#1f63c6; --lic-p:#4a5568;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0}
body{color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 104px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 24px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
.brand i{display:inline-block;width:14px;height:14px;background:repeating-conic-gradient(var(--fg) 0 25%,transparent 0 50%) 0 0/7px 7px;border:1px solid var(--fg)}
.conn{font:600 11px/1 var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer;background:none}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.conn.live{color:var(--good);border-color:var(--good)}.conn.live::before{background:var(--good)}
.conn.demo{color:var(--accent);border-color:var(--accent)}.conn.demo::before{background:var(--accent)}
.conn.wait{color:var(--warn);border-color:var(--warn)}.conn.wait::before{background:var(--warn)}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{font:600 15px/1.05 var(--f-display);letter-spacing:.05em;text-transform:uppercase;background:none;border:1px solid transparent;color:var(--muted);padding:8px 12px;border-radius:4px;cursor:pointer;text-align:center}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
nav.tabs button:hover:not([aria-selected="true"]){color:var(--fg);border-color:var(--line)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:4px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:6}
  nav.tabs button{flex:1;padding:9px 2px;font-size:13px;min-width:0}
  .hide-sm{display:none}
}
/* bilingual */
.t2{display:block;font-size:.8em;opacity:.68;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;line-height:1.15}
.inl .t2{display:inline;margin-left:.4em}
.inl .t2::before{content:"/ "}
section.view{padding-block:16px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 32px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(12,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1020px){.s2{grid-column:span 4}.s3{grid-column:span 6}.s4,.s5,.s7,.s8,.s6{grid-column:span 12}}
@media (max-width:520px){.s2{grid-column:span 6}.s3{grid-column:span 6}}
.label{font:600 11px/1.25 var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font:700 48px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px}
.mid{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.unit{font:500 15px var(--f-display);color:var(--muted);margin-left:4px;text-transform:none}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.pb{color:var(--pb)}.acc{color:var(--accent)}.muted{color:var(--muted)}.warn{color:var(--warn)}.blue{color:var(--blue)}
.flag{display:none;font:700 20px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:6px;margin-bottom:10px;text-align:center}
.flag.on{display:block}
.flag.yellow{background:var(--warn);color:#141a22}.flag.blue{background:var(--blue);color:#fff}.flag.white{background:#f4f6f9;color:#141a22;border:1px solid var(--line)}
.flag.checkered{background:repeating-conic-gradient(#141a22 0 25%,#f4f6f9 0 50%) 0 0/20px 20px;color:#fff;text-shadow:0 1px 3px #000}
.flag.black,.flag.red{background:var(--bad);color:#fff}.flag.green{background:var(--good);color:#141a22}
.rpm{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:10px}
.rpm span{height:16px;border-radius:2px;background:var(--surface2);border:1px solid var(--line)}
.rpm span.on{background:var(--good);border-color:transparent}
.rpm span.on.y{background:var(--warn)}.rpm span.on.r{background:var(--bad)}
.rpm.shift span.on{background:var(--pb)}
.rpm.blink span.on{animation:blink .16s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.gearbox{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.gear{font:700 92px/.85 var(--f-display);min-width:56px}
.bars{display:flex;gap:7px;height:84px;align-items:flex-end;margin-left:auto}
.bar{width:15px;height:100%;background:var(--surface2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.bar b{position:absolute;left:0;right:0;bottom:0;background:var(--good)}
.bar.brk b{background:var(--bad)}.bar.clu b{background:var(--blue)}
canvas{display:block;width:100%;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
.tscroll{overflow-x:auto}
th{font:600 11px/1.2 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tr.me td{background:color-mix(in srgb,var(--accent) 15%,transparent)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.pit td{opacity:.55}
tr.ahead td.nm{color:var(--bad)}tr.behind td.nm{color:var(--blue)}
.lic{display:inline-block;font:600 11px/1 var(--f-data);padding:3px 5px;border-radius:3px;color:var(--bg)}
.lic.R{background:var(--lic-r)}.lic.D{background:var(--lic-d)}.lic.C{background:var(--lic-c)}.lic.B{background:var(--lic-b)}.lic.A{background:var(--lic-a)}.lic.P{background:var(--lic-p)}
.pill{display:inline-block;font:600 11px/1 var(--f-data);letter-spacing:.05em;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.acc{border-color:var(--accent);color:var(--accent)}.pill.good{border-color:var(--good);color:var(--good)}.pill.bad{border-color:var(--bad);color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.meter b{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>div{min-width:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=email],input[type=password],input[type=search]{font:500 14px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0;max-width:100%}
.btn{font:600 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 14px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.note{font-size:13px;color:var(--muted);max-width:68ch;margin:6px 0 0}
.track{position:relative;height:34px;margin-top:8px}
.track::before{content:"";position:absolute;left:0;right:0;top:16px;height:2px;background:var(--line)}
.track .sf{position:absolute;left:0;top:6px;width:3px;height:22px;background:repeating-linear-gradient(var(--fg) 0 3px,transparent 3px 6px)}
.track .car{position:absolute;top:11px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--muted);border:2px solid var(--surface)}
.track .car.me{background:var(--accent);width:16px;height:16px;top:9px;margin-left:-8px;z-index:2}
.track .car.ahead{background:var(--bad)}.track .car.behind{background:var(--blue)}
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tyre{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-data);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
details.tree{font-family:var(--f-data);font-size:13px}
details.tree details{margin-left:14px}
details.tree summary{cursor:pointer;padding:2px 0;color:var(--fg)}
.leaf{margin-left:14px;padding:1px 0;overflow-wrap:anywhere}
.leaf b{color:var(--muted);font-weight:400}
.vrow{cursor:pointer}
.vrow td.val{max-width:46ch;overflow:hidden;text-overflow:ellipsis}
.vrow.open td.val{white-space:normal;overflow-wrap:anywhere}
.qr{background:#fff;padding:10px;border-radius:6px;width:180px;max-width:100%;display:block}
code{font-family:var(--f-data);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:1px 5px;overflow-wrap:anywhere}
pre.json{font:12px/1.45 var(--f-data);background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px;max-height:420px;overflow:auto;margin:10px 0 0}
.form{display:grid;gap:10px;max-width:440px}
.form label{display:grid;gap:4px}
.err{color:var(--bad);font-size:14px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
ol.steps{margin:6px 0 0;padding-left:20px;max-width:68ch}
ol.steps li{margin:4px 0}
/* tyres */
input.num{font:500 14px var(--f-data);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 6px;width:64px}
.callout{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:6px;padding:10px 13px;margin-bottom:10px;font-size:14px}
.callout b{font-weight:600}
.carbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.axle{grid-column:1/-1;text-align:center;font:600 11px/1 var(--f-data);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:2px 0;order:-1}
.tcard{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
.tcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.zone{border-radius:4px;padding:10px 2px 8px;text-align:center;color:#10141a;font:600 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.zone small{display:block;font:600 10px/1 var(--f-data);letter-spacing:.06em;opacity:.75;margin-top:4px}
.wear{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}
.wear span{font:500 12px var(--f-data);text-align:center;color:var(--muted)}
.tmeta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font:500 12px var(--f-data);color:var(--muted);flex-wrap:wrap}
.heat{display:inline-block;width:120px;height:8px;border-radius:4px;vertical-align:middle}
.hint{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.hint .tag{font:600 11px var(--f-data);letter-spacing:.06em;color:var(--muted)}
.bbar{display:grid;grid-template-columns:28px 1fr 64px;gap:8px;align-items:center;font:500 12px var(--f-data)}
.bbar .tr{height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bbar .tr b{display:block;height:100%;background:var(--bad)}
/* series */
.filters{display:grid;gap:8px}
.ftoggle{display:none;width:100%;margin-bottom:8px}
@media (max-width:820px){.ftoggle{display:block}.filters:not(.open) .frow:not(:first-child){display:none}}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow input[type=search]{flex:1 1 200px}
.chip{font:600 13px/1 var(--f-body);background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.chip .lic{font-size:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;display:grid;gap:8px;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.scard:hover{border-color:var(--accent)}
.scard .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.scard .nm{font:700 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.scard .row2{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.scard .k{color:var(--muted);font:600 10px/1.4 var(--f-data);letter-spacing:.1em;text-transform:uppercase}
.star{background:none;border:0;cursor:pointer;color:var(--muted);padding:2px;line-height:0}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.own{font:600 11px var(--f-data)}.own.y{color:var(--good)}.own.n{color:var(--bad)}
.next{font:600 15px var(--f-data);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:5px;flex-wrap:wrap}
table.plan{font-size:12px}
table.plan th,table.plan td{padding:5px 6px}
table.plan td.cell{min-width:92px;max-width:120px;white-space:normal;line-height:1.2;border-left:1px solid var(--line)}
table.plan td.cell.y{background:color-mix(in srgb,var(--good) 18%,transparent)}
table.plan td.cell.n{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--muted)}
table.plan td.cell.cur{box-shadow:inset 0 0 0 2px var(--accent)}
table.plan td.cell.past{opacity:.45}
table.plan td.sname{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:190px;white-space:normal;font-weight:600}
.agday{font:700 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px;color:var(--muted)}
.agrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.agrow .t{font:600 15px var(--f-data)}
.agrow .s{min-width:0}.agrow .s div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{font:600 12px var(--f-data);background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:6px 8px;cursor:pointer;white-space:nowrap}
.pin[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.lcard{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px}
.srbar{position:relative;height:8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);margin-top:8px;overflow:visible}
.srbar b{display:block;height:100%;border-radius:4px;background:var(--good)}
.srbar i{position:absolute;top:-4px;width:2px;height:14px;background:var(--muted)}
.drawer{position:fixed;inset:0;z-index:30}
.drawer-bg{position:absolute;inset:0;background:rgba(5,8,12,.55)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:820px){
  nav.tabs{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;padding:9px 11px}
}

/* widgets, overlays, map */
.wpanel{position:relative}
.popbtn{position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;opacity:.75}
.popbtn:hover{opacity:1;color:var(--accent);border-color:var(--accent)}
.popbtn svg{width:14px;height:14px}
.wpanel>.vhead:first-child,.wpanel>.label:first-child{padding-right:32px}
.wpanel[data-w=dash] .bars{margin-right:30px}
.btn.small{padding:6px 9px;font-size:12px}

.inbars{display:flex;gap:8px;align-items:flex-end}

.ibar{width:18px;height:90px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}

.ibar.thr b{background:var(--good)}.ibar.brk b{background:var(--bad)}.ibar.clu b{background:var(--blue)}

.boost{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}

#ovBar,#ovRes{display:none}

    x.beginPath();hs.forEach((y,k)=>{const X=k/(hs.length-1)*w,Y=h-2-(y-mn)/(mx-mn)*(h-4);k?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle=css("--accent");x.lineWidth=1.5;x.stroke()})}

    item.classList.add("dragging");Object.assign(item.style,{width:r.width+"px",height:r.height+"px",left:r.left+"px",top:r.top+"px"});
    let scrollV=0,raf=0;const tick=()=>{if(scrollV){scrollBy(0,scrollV);raf=requestAnimationFrame(tick)}else raf=0};

      scrollV=ev.clientY<70?-10:ev.clientY>innerHeight-90?10:0;if(scrollV&&!raf)raf=requestAnimationFrame(tick);
      const over=document.elementFromPoint(ev.clientX,ev.clientY),tgt=over&&over.closest(itemSel+",.ph");if(!tgt||tgt===ph||tgt===item||tgt.parentElement!==container)return;
      const tr=tgt.getBoundingClientRect(),after=(ev.clientX-tr.left)/tr.width+(ev.clientY-tr.top)/tr.height>1;container.insertBefore(ph,after?tgt.nextSibling:tgt)};
    const up=()=>{document.documentElement.classList.remove("sorting");removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);scrollV=0;
      container.insertBefore(item,ph);ph.remove();item.classList.remove("dragging");item.setAttribute("style",keep);onDone([...container.querySelectorAll(itemSel)].filter(x=>x.parentElement===container).map(keyOf))};
    addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",up)})}

  const dt=ST.lt==null?0:t-ST.lt;ST.lt=t;if(!(dt>0&&dt<.5)||!T.IsOnTrack)return;const c=ST.cur,th=T.Throttle||0,br=T.Brake||0;c.t+=dt;if(th>.98)c.full+=dt;if(br>.05)c.brk+=dt;if(th<.05&&br<.05)c.coast+=dt;
  if(T.Gear!=null&&c.g!=null&&T.Gear!==c.g&&T.Gear>0)c.shifts++;c.g=T.Gear;c.top=Math.max(c.top,T.Speed||0);const b=slipAngle();if(b!=null)c.slip=Math.max(c.slip,Math.abs(b))}
function slipAngle(){const vx=T.VelocityX,vy=T.VelocityY;if(vx==null||vy==null||Math.abs(vx)<5)return null;return Math.atan2(vy,vx)*180/Math.PI}
function renderStats(){const box=$("#statsBox");if(!box)return;const c=ST.cur,l=ST.last,pc=(s,k)=>s&&s.t>0?Math.round(s[k]/s.t*100)+"%":"–";const b=slipAngle();
  const rows=[["Full throttle","Gas a fondo",s=>pc(s,"full")],["Braking","Frenando",s=>pc(s,"brk")],["Coasting","Sin pedales",s=>pc(s,"coast")],["Gear changes","Cambios de marcha",s=>s?s.shifts:"–"],["Top speed","Vel. máxima",s=>s&&s.top?Math.round(spd(s.top))+" "+spdU():"–"],["Max slip angle","Deslizamiento máx.",s=>s&&s.slip?s.slip.toFixed(1)+"°":"–"]];
  box.innerHTML=`<table class="wtable"><thead><tr><th></th><th class="r">${esc(Tx("This lap","Esta vuelta"))}</th><th class="r">${esc(Tx("Last","Última"))}</th></tr></thead><tbody>${rows.map(([en,es,f])=>`<tr><td>${esc(Tx(en,es))}</td><td class="r mono">${f(c)}</td><td class="r mono">${f(l)}</td></tr>`).join("")}</tbody></table>
   <div class="label" style="margin-top:8px">${L("it.slip",true)} <span class="mono" style="color:var(--fg)">${b==null?"–":b.toFixed(1)+"°"}</span></div><div class="slipbar"><b style="left:${b==null?50:50+Math.max(-1,Math.min(1,b/10))*50}%"></b></div>`}
Object.assign(I18N,{"it.slip":["Car slip angle now","Deslizamiento del coche ahora"]});

/* ---------- Garage 61 ---------- */
let G61={connected:false,user:null},G61REF=null,G61CACHE={};
async function g61Status(){if(MODE!=="bridge"||REMOTE)return G61;try{G61=await (await fetch("/api/g61/status")).json()}catch(e){}return G61}
async function g61Get(path){if(G61CACHE[path])return G61CACHE[path];const r=await fetch("/api/g61/"+path);if(!r.ok){let m="HTTP "+r.status;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}const ct=r.headers.get("Content-Type")||"";const v=ct.includes("json")?await r.json():await r.text();if(!path.includes("/csv"))G61CACHE[path]=v;return v}
const listOf=v=>Array.isArray(v)?v:(v&&(v.items||v.data||v.results))||[];
function g61UserName(u){if(!u)return"";return u.nickName||u.name||[u.firstName,u.lastName].filter(Boolean).join(" ")||u.slug||""}
async function renderG61Panel(){const box=$("#g61Panel");if(!box)return;if(MODE!=="bridge"||REMOTE){box.innerHTML=`<h2>${L("g61")}</h2><p class="note">${Lp("Connect Garage 61 in the app running from PitWall.exe.","Conecta Garage 61 en la app desde PitWall.exe.")}</p>`;return}
  await g61Status();box.innerHTML=`<h2>${L("g61")}</h2>`+(G61.connected?`<p>${Lp("Connected","Conectado",true)}${G61.user?": <b>"+esc(g61UserName(G61.user))+"</b>":""}</p><p class="note">${Lp("Load a Garage 61 lap as a reference in Live → Lap comparison.","Carga una vuelta de Garage 61 como referencia en En vivo → Comparación de vueltas.")}</p><button class="btn" id="g61Off" type="button">${L("disconnect",true)}</button>`
   :`<p class="note">${Lp("Use your laps (or your team's) from Garage 61 as the reference while you drive. Create a personal token at garage61.net/developer and paste it here.","Usa tus vueltas (o las de tu equipo) de Garage 61 como referencia mientras conduces. Crea un token personal en garage61.net/developer y pégalo aquí.")}</p>
     <form class="frow" id="g61Form"><input type="password" id="g61Tok" placeholder="Token" style="flex:1;min-width:200px" autocomplete="off"><button class="btn primary" type="submit">${L("connect",true)}</button></form><div class="err" id="g61Err"></div>
     <p class="note"><a class="acc" href="https://garage61.net/developer" target="_blank" rel="noopener">garage61.net/developer</a></p>`);
  if($("#g61Off"))$("#g61Off").onclick=async()=>{await fetch("/api/g61/token",{method:"POST",body:JSON.stringify({Token:""})});G61CACHE={};renderG61Panel()};
  if($("#g61Form"))$("#g61Form").onsubmit=async e=>{e.preventDefault();$("#g61Err").textContent="";const r=await fetch("/api/g61/token",{method:"POST",body:JSON.stringify({Token:$("#g61Tok").value})});const j=await r.json().catch(()=>({}));if(!r.ok){$("#g61Err").textContent=j.error||"Error";return}renderG61Panel()}}
function bestMatch(list,name,extra){const toks=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(t=>t.length>1);const want=new Set(toks(name+" "+(extra||"")));
  let best=null,bs=0;list.forEach(it=>{const label=[it.name,it.variant,it.config,it.layout,it.configName].filter(Boolean).join(" ");const tt=toks(label);const sc=tt.filter(t=>want.has(t)).length/Math.max(1,tt.length)+tt.filter(t=>want.has(t)).length*.01;if(sc>bs){bs=sc;best=it}});return best}
async function openG61Picker(){LAYOUT_VIEW=null;$("#dTitle").innerHTML=L("g61Ref");$("#dSub").innerHTML=Lp("Pick a lap to compare against while you drive.","Elige una vuelta para compararte mientras conduces.");$("#dBody").innerHTML=`<p class="note">…</p>`;$("#drawer").hidden=false;
  await g61Status();if(!G61.connected){$("#dBody").innerHTML=`<p class="note">${Lp("Connect Garage 61 first in the Account tab.","Conecta primero Garage 61 en la pestaña Cuenta.")}</p>`;return}
  try{const[tracks,cars]=await Promise.all([g61Get("tracks"),g61Get("cars")]);const TL=listOf(tracks),CL=listOf(cars);const wi=S.WeekendInfo||{},me=driverBy(T.PlayerCarIdx)||{};
    const tm=bestMatch(TL,wi.TrackDisplayName,wi.TrackConfigName),cm=bestMatch(CL,me.CarScreenName||"");
    const opt=(list,sel)=>list.map(it=>`<option value="${esc(it.id)}"${sel&&it.id===sel.id?" selected":""}>${esc([it.name,it.variant||it.config||it.layout].filter(Boolean).join(" · "))}</option>`).join("");
    $("#dBody").innerHTML=`<div class="frow"><select id="g61T" style="flex:1">${opt(TL,tm)}</select><select id="g61C" style="flex:1">${opt(CL,cm)}</select></div>
      <div class="frow" style="margin-top:8px"><button type="button" class="chip" id="g61Mine" aria-pressed="true">${esc(Tx("My laps","Mis vueltas"))}</button><button type="button" class="chip" id="g61All" aria-pressed="false">${esc(Tx("Everyone","Todos"))}</button></div><div id="g61Laps" style="margin-top:10px"></div>`;
    let who="me";const load=async()=>{const box=$("#g61Laps");box.innerHTML=`<p class="note">…</p>`;try{const q=`laps?tracks=${$("#g61T").value}&cars=${$("#g61C").value}${who==="me"?"&drivers=me":""}&group=${who==="me"?"none":"driver"}&limit=25`;
        const laps=listOf(await g61Get(q)).sort((a,b)=>(a.lapTime||1e9)-(b.lapTime||1e9));
        box.innerHTML=laps.length?laps.map(l=>`<div class="agrow" style="grid-template-columns:90px 1fr auto"><span class="t">${fmtT(l.lapTime)}</span><span class="s"><div>${esc(g61UserName(l.driver)||Tx("You","Tú"))}</div><div class="muted" style="font-size:12px">${esc(l.startTime?new Date(l.startTime).toLocaleDateString(locale()):"")}</div></span><button type="button" class="pin" data-lap="${esc(l.id)}" data-t="${l.lapTime}" data-n="${esc(g61UserName(l.driver)||"")}">${esc(Tx("Use","Usar"))}</button></div>`).join(""):`<p class="note">${Lp("No laps found for this car and track.","No hay vueltas para este coche y circuito.")}</p>`;
        box.querySelectorAll("[data-lap]").forEach(b=>b.onclick=async()=>{b.textContent="…";try{const csv=await g61Get(`laps/${b.dataset.lap}/csv`);G61REF=csvToLap(csv,+b.dataset.t,b.dataset.n);if(!G61REF)throw new Error(Tx("This lap has no telemetry","Esta vuelta no tiene telemetría"));closeDrawer();toast(Tx("Reference lap loaded","Vuelta de referencia cargada"));drawCompare()}catch(err){b.textContent=err.message}})}
      catch(err){box.innerHTML=`<p class="err">${esc(err.message)}</p>`}};
    $("#g61T").onchange=$("#g61C").onchange=load;$("#g61Mine").onclick=()=>{who="me";$("#g61Mine").setAttribute("aria-pressed",true);$("#g61All").setAttribute("aria-pressed",false);load()};$("#g61All").onclick=()=>{who="all";$("#g61All").setAttribute("aria-pressed",true);$("#g61Mine").setAttribute("aria-pressed",false);load()};load()}
  catch(err){$("#dBody").innerHTML=`<p class="err">${esc(err.message)}</p>`}}
function csvToLap(csv,lapTime,name){const lines=String(csv).trim().split(/\r?\n/);if(lines.length<20)return null;const head=lines[0].split(",").map(s=>s.trim().replace(/^"|"$/g,""));const ix=k=>head.indexOf(k);
  const iP=ix("LapDistPct"),iV=ix("Speed");if(iP<0||iV<0)return null;const iT=ix("Throttle"),iB=ix("Brake"),iG=ix("Gear"),iS=ix("SteeringWheelAngle"),iR=ix("RPM"),iL=ix("LapCurrentLapTime");
  const len=trackLenM(),bins=[];let t=0,lastD=null;
  for(let k=1;k<lines.length;k++){const c=lines[k].split(",");const p=+c[iP],v=+c[iV];if(!(p>=0&&p<=1)||!isFinite(v))continue;const d=p*len;
    if(iL>=0)t=+c[iL];else if(lastD!=null&&d>lastD)t+=(d-lastD)/Math.max(v,1);lastD=d;const b=Math.floor(d/BIN);if(!bins[b])bins[b]=[v,t,iT>=0?+c[iT]:0,iB>=0?+c[iB]:0,iG>=0?+c[iG]:null,iS>=0?+c[iS]:null,iR>=0?+c[iR]:null]}
  return{n:"G61",name,time:lapTime||t,bins,maxBin:bins.length-1}}

/* ---------- engineer sharing ---------- */

  let st={};try{st=await (await fetch("/api/share")).json()}catch(e){}const urls=(INFO&&INFO.urls)||[];

   <div class="grid" style="margin-top:8px"><div class="s6"><div class="label">${L("sameNet",true)}</div><div class="mono" style="margin-top:6px">${urls.map(u=>esc(u+"/?view=engineer")).join("<br>")||"–"}</div>${urls[0]?`<img class="qr" style="margin-top:8px;width:150px" alt="QR" src="/api/qr.png?u=${encodeURIComponent(urls[0]+"/?view=engineer")}">`:""}</div>
   <div class="s6"><div class="label">${L("internet",true)}</div>${st.link?`<div class="frow" style="margin-top:6px"><input type="text" id="shareLink" readonly value="${esc(st.link)}" style="flex:1;min-width:200px"><button class="btn" type="button" id="shareCopy">${L("copy",true)}</button></div>
      <img class="qr" style="margin-top:8px;width:150px" alt="QR" src="/api/qr.png?u=${encodeURIComponent(st.link)}"><div style="margin-top:8px"><button class="btn" type="button" id="shareStop">${L("stopLink",true)}</button></div>`
     :st.starting?`<p class="note">${Lp("Creating the link… the first time this downloads a small tool from Cloudflare.","Creando el enlace… la primera vez descarga una pequeña herramienta de Cloudflare.")}</p>`
     :`<div style="margin-top:6px"><button class="btn primary" type="button" id="shareStart">${L("startLink",true)}</button></div>${st.error?`<p class="err">${esc(st.error)}</p>`:""}<p class="note">${Lp("A private link through Cloudflare (free). It stops working when you press Stop or close PitWall.","Un enlace privado a través de Cloudflare (gratis). Deja de funcionar al pulsar Dejar de compartir o al cerrar PitWall.")}</p>`}</div></div>`;
  if($("#shareStart"))$("#shareStart").onclick=async()=>{await fetch("/api/share?action=start",{method:"POST"});renderShare();pollShare()};
  if($("#shareStop"))$("#shareStop").onclick=async()=>{await fetch("/api/share?action=stop",{method:"POST"});renderShare()};
  if($("#shareCopy"))$("#shareCopy").onclick=()=>{const i=$("#shareLink");navigator.clipboard.writeText(i.value).then(()=>toast(Tx("Link copied","Enlace copiado"))).catch(()=>{i.select()})};
  if(st.starting)pollShare()}
let sharePoll=0;function pollShare(){clearTimeout(sharePoll);sharePoll=setTimeout(async()=>{if(CUR_VIEW==="settings")renderShare()},1500)}

/* ===================== settings & connection ===================== */
function renderConn(){const c=$("#conn");let cls,en,es;
  if(STATUS.offline){cls="wait";en="PC offline";es="PC sin conexión"}
  else if(REMOTE){cls="live";en="Engineer view";es="Vista de ingeniero"}
  else if(STATUS.demo){cls="demo";en="Demo";es="Demo"}
  else if(STATUS.connected){cls="live";en="iRacing live";es="iRacing en vivo"}
  else{cls="wait";en="Waiting for iRacing";es="Esperando iRacing"}
  c.className="conn "+cls;c.textContent=Tx(en,es);renderSettings()}
function renderSettings(){
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===LANG));
  document.querySelectorAll("#unitSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.u===UNITS));
  const th=store.get("pw.theme","dark");document.querySelectorAll("#themeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.th===th));
  const note=$("#srcNote"),btn=$("#demoBtn");
  if(MODE==="bridge"){$("#demoCtl").hidden=false;btn.innerHTML=STATUS.demo?Lp("Use iRacing","Usar iRacing",true):Lp("Start demo","Iniciar demo",true);
    note.innerHTML=STATUS.demo?Lp("Showing a simulated race. Switch back to read iRacing.","Mostrando una carrera simulada. Vuelve a iRacing para leer el simulador."):STATUS.connected?Lp("Reading iRacing telemetry from this PC.","Leyendo la telemetría de iRacing en este PC."):Lp("PitWall is running. Start iRacing and get in the car; data appears automatically.","PitWall está funcionando. Abre iRacing y súbete al coche; los datos aparecen solos.")}
  else{$("#demoCtl").hidden=true;note.innerHTML=Lp("This is a preview with simulated data. To read iRacing, run PitWall.exe on the PC where you race and open the address it shows.","Esto es una vista previa con datos simulados. Para leer iRacing, ejecuta PitWall.exe en el PC donde corres y abre la dirección que muestra.")}

(async function boot(){

  catch(e){MODE="local";CFG=Object.assign(CFG,store.get("pw.cfg",{}))}

  if(MODE==="bridge"){connectBridge();setInterval(async()=>{try{INFO=await (await fetch("/api/info")).json();if(CUR_VIEW==="settings")renderSettings()}catch(e){}},15000);keepAwake()}
  else Demo.start();
})();
